name: VIGIL-FLOOD CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. FRONTEND CI: TypeScript Type-check & Production Build
  frontend-ci:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend_react/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend_react
        run: npm ci || npm install

      - name: Execute TypeScript verification & build
        working-directory: ./frontend_react
        run: npm run build

      - name: Archive frontend distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend_react/dist/
          retention-days: 2

  # 2. BACKEND CI: Python ML Models & Core Engine Verification
  backend-ci:
    name: Backend Pipeline & Model Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated unit & pipeline test suite
        run: |
          python -m unittest backend/tests/test_pipeline.py

  # 3. CONTINUOUS DEPLOYMENT (CD): Auto-Deploy to Production Cloud
  deploy-cd:
    name: Production Deployment (Render)
    needs: [frontend-ci, backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch Render deployment webhook
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Dispatching Render automated production deployment..."
            curl -s -f -X POST "$DEPLOY_HOOK"
            echo "Render deployment webhook successfully dispatched."
          else
            echo "Note: 'RENDER_DEPLOY_HOOK' secret is not configured in repository secrets."
          fi
